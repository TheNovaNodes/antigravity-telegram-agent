name: Minimal CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" || python -m pip install -e . || echo "Skipping local install"
      - run: python -m compileall -q .
        env:
          TELEGRAM_BOT_TOKEN: "dummy"
          ALLOWED_USER_IDS: "12345"
          AGY_BINARY_PATH: "agy"
      - run: python -m pytest --collect-only -q || echo "No tests"
