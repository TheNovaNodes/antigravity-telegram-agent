name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"

    steps:
    - name: Checkout repository (shallow)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: Check code formatting (gofmt)
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files found:"
          echo "$unformatted"
          exit 1
        fi

    - name: Verify module dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Run Linter (go vet)
      run: make lint

    - name: Install Static Analysis & SAST Tools
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run SAST Security Scans (staticcheck & gosec)
      run: make sast

    - name: Run Vulnerability Check (govulncheck)
      run: make vuln

    - name: Run Tests with Race Detector
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Show Coverage Report
      run: go tool cover -func=coverage.out

    - name: Build binary
      run: go build -v ./...
