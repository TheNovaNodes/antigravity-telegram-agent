name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"

    steps:
    - name: Checkout repository (shallow)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: Check code formatting (gofmt)
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files found:"
          echo "$unformatted"
          exit 1
        fi

    - name: Verify module dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Run Linter (go vet)
      run: make lint

    - name: Cache SAST & Linter Binaries
      id: cache-sast
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-sast-tools-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-sast-tools-

    - name: Install Static Analysis & SAST Tools
      if: steps.cache-sast.outputs.cache-hit != 'true'
      run: |
        for tool in "honnef.co/go/tools/cmd/staticcheck@latest" "github.com/securego/gosec/v2/cmd/gosec@latest" "golang.org/x/vuln/cmd/govulncheck@latest"; do
          echo "Installing $tool..."
          installed=0
          for attempt in 1 2 3; do
            if go install "$tool"; then
              installed=1
              break
            fi
            echo "Attempt $attempt failed to install $tool, retrying in 5s..."
            sleep 5
          done
          if [ "$installed" -ne 1 ]; then
            echo "Failed to install $tool after 3 attempts"
            exit 1
          fi
        done

    - name: Run SAST Security Scans (staticcheck & gosec)
      run: make sast

    - name: Run Vulnerability Check (govulncheck)
      run: |
        checked=0
        for attempt in 1 2 3; do
          if make vuln; then
            checked=1
            break
          fi
          echo "govulncheck attempt $attempt failed (transient network or DB issue), retrying in 5s..."
          sleep 5
        done
        if [ "$checked" -ne 1 ]; then
          echo "govulncheck failed after 3 attempts"
          exit 1
        fi

    - name: Run Tests with Race Detector
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Show Coverage Report
      run: go tool cover -func=coverage.out

    - name: Build binary (CGO_ENABLED=0)
      run: CGO_ENABLED=0 go build -v ./...
