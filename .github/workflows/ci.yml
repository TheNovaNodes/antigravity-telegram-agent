name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"

    steps:
    - name: Checkout repository (shallow)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: Check code formatting (gofmt)
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files found:"
          echo "$unformatted"
          exit 1
        fi

    - name: Verify module dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Run Linter (go vet)
      run: make lint

    - name: Cache SAST & Linter Binaries
      id: cache-sast
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-sast-tools-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-sast-tools-

    - name: Install Static Analysis & SAST Tools
      if: steps.cache-sast.outputs.cache-hit != 'true'
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run SAST Security Scans (staticcheck & gosec)
      run: make sast

    - name: Run Vulnerability Check (govulncheck)
      run: make vuln

    - name: Run Tests with Race Detector
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Show Coverage Report
      run: go tool cover -func=coverage.out

    - name: Build binary (CGO_ENABLED=0)
      run: CGO_ENABLED=0 go build -v ./...
