[project]
name = "antigravity-telegram-agent"
version = "0.1.0"
description = "Telegram Bot Bridge for Google Antigravity (AGY)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4.1",
    "google-antigravity",
    "python-dotenv>=1.0.1",
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
    "aiohttp>=3.9.0",
    "apscheduler>=3.10.4",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.hatch.build.targets.wheel]
packages = ["src"]
